<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
        }

        body{
            display:flex;
            background-color:rgb(239, 228, 228);
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            max-height:900px;
            width:100%
        }

        .card{ 
            display:flex;
            background-color:#f8f8f8;
            border:1px solid #e0e0e0;
            border-radius:4px;
            overflow:hidden;
            padding: 12px;
            gap:15px;
            align-items:center;
        }

        .card img {
            width:130px;
            height:110px;
            border-radius:2px;
            object-fit:cover;
            flex-shrink:0;
        }

        .details{ 
            display:flex
            flex-direction:column;
            align-items:flex-start;
            gap:8px;
        }
          
        .details h3{
            font-size: 16px;
            font-weight: bold;
            color:#333;
        }

        .details p{
            font-size: 13px;
            color:#666;
        }

        .btn{ 
            background-color: #ff4d4d;
            color:white;
            border:none;
            padding:8px 14px;
            border-radius:4px;
            font-size:13px;
            cursor:pointer;
            font-weight:bold;
        }

        .btn:hover{
            background-color:#e03e3e;
        }

        @media (max-width:600px){
            .container {
                grid-template-columns:1fr;
            }
        }

    </style>
    <title>Document</title>
</head>
<body>
    <div class="container">

    <div class="card" >
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRydl3BR7A7uFkSHNnpq4dB4vh2JrMYQyVMnvfGzfqKNg&s=10" alt="ET (2022)">
        <div class="details">
        <h3>ET (2022)</h3>
