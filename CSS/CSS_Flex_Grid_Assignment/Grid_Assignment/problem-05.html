<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <style>
    /* Reset & Base Box Model */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 4-column Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr 1fr;
      grid-template-rows: repeat(3, 100px);
      gap: 20px;
      width: 100%;
      max-width: 800px;
      grid-template-areas:
        "box1 box2 box2 box3"
        "box4 box4 box5 box6"
        "box7 box8 box9 box9";
    }

    /* Common Block Styles */
    .block {
      background-color: #31b87a; /* Green shade */
      border-radius: 4px;
    }

    /* Area Assignments */
    .box1 { grid-area: box1; }
    .box2 { grid-area: box2; }
    .box3 { grid-area: box3; }
    .box4 { grid-area: box4; }
    .box5 { grid-area: box5; }
    .box6 { grid-area: box6; }
    .box7 { grid-area: box7; }
    .box8 { grid-area: box8; }
    .box9 { grid-area: box9; }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- Row 1 -->
    <div class="block box1"></div>
    <div class="block box2"></div>
    <div class="block box3"></div>

    <!-- Row 2 -->
    <div class="block box4"></div>
    <div class="block box5"></div>
    <div class="block box6"></div>

    <!-- Row 3 -->
    <div class="block box7"></div>
    <div class="block box8"></div>
    <div class="block box9"></div>
  </div>

</body>
</html>
